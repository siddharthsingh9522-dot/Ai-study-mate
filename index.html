  <!-- Transformers.js for in-browser local AI (zero API cost). Only the small JS
       library loads here; the embedding model itself is fetched lazily, on the first
       real local search, and only on devices DeviceProfiler judges powerful enough. -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';
    env.allowLocalModels = false;
    let extractorPromise = null;
    function getExtractor() {
      if (!extractorPromise) extractorPromise = pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
      return extractorPromise;
    }
    function cosineSim(a, b) {
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
      return dot / (Math.sqrt(na) * Math.sqrt(nb) || 1);
    }
    window.LocalTransformersEngine = {
      ready: false,
      async warm() { await getExtractor(); this.ready = true; },
      // chunks: array of strings, or array of {text,...}. Returns the topK closest
      // items (same shape as the input) — this never touches Gemini/Groq or the network
      // beyond the one-time model download.
      async search(query, chunks, topK = 3) {
